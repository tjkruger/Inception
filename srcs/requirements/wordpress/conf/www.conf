[www]
user = www-data
group = www-data

; Listen on all interfaces on port 9000 so the nginx container can reach
; this over the docker network via the service name (wordpress:9000).
; A unix socket would need a shared volume between containers, which is
; more setup for no real benefit here.
listen = 0.0.0.0:9000

pm = dynamic
pm.max_children = 5
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3

clear_env = no
